<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" width="1180" height="720" font-family="ui-sans-serif, system-ui, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f85149"/>
    </marker>
  </defs>

  <rect width="1180" height="720" fill="#0d1117"/>
  <text x="28" y="40" fill="#e6edf3" font-size="19" font-weight="700" letter-spacing="0.08em">MASKEDRUNNER — ARCHITECTURE</text>
  <text x="28" y="62" fill="#8b949e" font-size="12.5">Service-account workflow integrity verification. Two inputs (what the rules are, what actually happened) meet in one decision: was this outcome reachable?</text>

  <!-- ============ LEFT: EVIDENCE ============ -->
  <text x="28" y="102" fill="#6e7681" font-size="11" font-weight="600" letter-spacing="0.14em">1 · EVIDENCE — what actually happened</text>
  <rect x="28" y="114" width="300" height="150" rx="8" fill="#090c10" stroke="#21262d"/>
  <text x="44" y="136" fill="#8b949e" font-size="11">three independent log planes</text>

  <rect x="44" y="146" width="268" height="30" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="56" y="165" fill="#e6edf3" font-size="12">CI runner log</text>
  <text x="200" y="165" fill="#6e7681" font-size="10.5">has step names</text>

  <rect x="44" y="182" width="268" height="30" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="56" y="201" fill="#e6edf3" font-size="12">Registry log</text>
  <text x="180" y="201" fill="#d29922" font-size="10.5">effect only, no step</text>

  <rect x="44" y="218" width="268" height="30" rx="5" fill="#161b22" stroke="#30363d"/>
  <text x="56" y="237" fill="#e6edf3" font-size="12">Cloud audit log</text>
  <text x="180" y="237" fill="#d29922" font-size="10.5">effect only, no step</text>

  <!-- adapters -->
  <rect x="28" y="286" width="300" height="96" rx="8" fill="#121a26" stroke="#1f4b82"/>
  <text x="44" y="308" fill="#4493f8" font-size="12.5" font-weight="600">crates/adapters</text>
  <text x="44" y="328" fill="#8b949e" font-size="11">job → transition · effect-only records kept step-less</text>
  <text x="44" y="345" fill="#8b949e" font-size="11">derives_from edge ONLY from real provenance</text>
  <text x="44" y="362" fill="#8b949e" font-size="11">partial order: clocks trusted within a plane only</text>

  <rect x="28" y="400" width="300" height="52" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="421" fill="#e6edf3" font-size="12.5" font-weight="600">Observation</text>
  <text x="44" y="440" fill="#6e7681" font-size="11">records + effects + relation edges + plane trust</text>

  <!-- ============ RIGHT: RULES ============ -->
  <text x="852" y="102" fill="#6e7681" font-size="11" font-weight="600" letter-spacing="0.14em" text-anchor="end">2 · RULES — what is allowed</text>
  <rect x="852" y="114" width="300" height="70" rx="8" fill="#090c10" stroke="#21262d"/>
  <text x="868" y="136" fill="#e6edf3" font-size="12">.github/workflows/*.yml</text>
  <text x="868" y="156" fill="#6e7681" font-size="11">the real pipeline definition</text>
  <text x="868" y="173" fill="#6e7681" font-size="11">jobs + needs: graph</text>

  <rect x="852" y="204" width="300" height="66" rx="8" fill="#121a26" stroke="#1f4b82"/>
  <text x="868" y="226" fill="#4493f8" font-size="12.5" font-weight="600">generate</text>
  <text x="868" y="245" fill="#8b949e" font-size="11">needs: graph → places + transitions</text>
  <text x="868" y="262" fill="#8b949e" font-size="11">human adds the effect relations (TODO)</text>

  <rect x="852" y="290" width="300" height="62" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="868" y="312" fill="#e6edf3" font-size="12.5" font-weight="600">spec.wsl.yaml</text>
  <text x="868" y="331" fill="#6e7681" font-size="11">coloured Petri net: places, transitions,</text>
  <text x="868" y="346" fill="#6e7681" font-size="11">identities, effects, relations · signed + hashed</text>

  <rect x="852" y="372" width="300" height="56" rx="8" fill="#12201a" stroke="#2f6b3b"/>
  <text x="868" y="393" fill="#3fb950" font-size="12.5" font-weight="600">crates/wsl — lint</text>
  <text x="868" y="412" fill="#8b949e" font-size="11">soundness: deadlocks, dead transitions, bindings</text>

  <!-- ============ CENTER: ENGINE ============ -->
  <text x="590" y="102" fill="#6e7681" font-size="11" font-weight="600" letter-spacing="0.14em" text-anchor="middle">3 · THE DECISION</text>
  <rect x="376" y="114" width="428" height="338" rx="10" fill="#0f1520" stroke="#30363d" stroke-width="1.5"/>
  <text x="590" y="140" fill="#e6edf3" font-size="13.5" font-weight="700" text-anchor="middle">crates/engine</text>
  <text x="590" y="160" fill="#8b949e" font-size="11.5" text-anchor="middle">bounded unfolding of the net, guided by the observation</text>

  <rect x="400" y="178" width="380" height="74" rx="7" fill="#161b22" stroke="#30363d"/>
  <text x="416" y="199" fill="#4493f8" font-size="12" font-weight="600">Layer 1 · path feasibility</text>
  <text x="416" y="218" fill="#8b949e" font-size="11">could these steps fire, in some order, by these principals?</text>
  <text x="416" y="236" fill="#6e7681" font-size="10.5">firing rule + guards + identity + binding unification</text>

  <rect x="400" y="262" width="380" height="74" rx="7" fill="#161b22" stroke="#30363d"/>
  <text x="416" y="283" fill="#a371f7" font-size="12" font-weight="600">Layer 2 · effect realizability</text>
  <text x="416" y="302" fill="#8b949e" font-size="11">are the consequences producible?</text>
  <text x="416" y="320" fill="#6e7681" font-size="10.5">observed effect graph must embed; obligations discharged</text>

  <rect x="400" y="348" width="380" height="42" rx="7" fill="#1a1526" stroke="#3c1e70"/>
  <text x="416" y="366" fill="#a371f7" font-size="11.5" font-weight="600">slack</text>
  <text x="470" y="366" fill="#8b949e" font-size="11">unlogged steps forgiven; survives max slack = robust</text>
  <text x="416" y="382" fill="#6e7681" font-size="10.5">a missing log line is forgiven, a missing cause is not</text>

  <text x="590" y="416" fill="#8b949e" font-size="11.5" text-anchor="middle">a run can pass Layer 1 and fail Layer 2</text>
  <text x="590" y="434" fill="#6e7681" font-size="11" text-anchor="middle">(that is exactly what happened at cap-js)</text>

  <!-- arrows into engine -->
  <path d="M336 426 L370 426 L370 300 L392 300" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M844 400 L820 400 L820 300 L790 300" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M178 264 L178 280" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M178 382 L178 396" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M1002 184 L1002 200" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M1002 270 L1002 286" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M1002 352 L1002 368" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ============ OUTPUTS ============ -->
  <text x="28" y="500" fill="#6e7681" font-size="11" font-weight="600" letter-spacing="0.14em">4 · OUTPUT — a proof, not a score</text>

  <rect x="376" y="470" width="196" height="92" rx="8" fill="#0f2417" stroke="#2f6b3b"/>
  <text x="392" y="492" fill="#3fb950" font-size="13" font-weight="700">ACCEPT</text>
  <text x="392" y="512" fill="#8b949e" font-size="11">witness path: the exact</text>
  <text x="392" y="528" fill="#8b949e" font-size="11">legal route that explains it</text>
  <text x="392" y="548" fill="#6e7681" font-size="10.5">unusual ≠ impossible</text>

  <rect x="608" y="470" width="196" height="92" rx="8" fill="#2a1315" stroke="#f85149"/>
  <text x="624" y="492" fill="#f85149" font-size="13" font-weight="700">REJECT</text>
  <text x="624" y="512" fill="#8b949e" font-size="11">longest legal prefix +</text>
  <text x="624" y="528" fill="#8b949e" font-size="11">blocked step + minimal cause</text>
  <text x="624" y="548" fill="#6e7681" font-size="10.5">smallest impossible fact set</text>

  <path d="M474 452 L474 464" fill="none" stroke="#3fb950" stroke-width="1.4" marker-end="url(#arg)"/>
  <path d="M706 452 L706 464" fill="none" stroke="#f85149" stroke-width="1.4" marker-end="url(#arr)"/>

  <rect x="376" y="582" width="428" height="60" rx="8" fill="#121a26" stroke="#1f4b82"/>
  <text x="392" y="604" fill="#4493f8" font-size="12.5" font-weight="600">crates/explain — signed certificate</text>
  <text x="392" y="623" fill="#8b949e" font-size="11">Ed25519 · spec hash + observation hash + bound + slack + cause</text>
  <text x="392" y="638" fill="#6e7681" font-size="10.5">re-verifiable by someone who trusts neither the service nor its storage</text>
  <path d="M590 562 L590 576" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ============ SURFACES ============ -->
  <text x="28" y="590" fill="#6e7681" font-size="11" font-weight="600" letter-spacing="0.14em">SURFACES</text>
  <rect x="28" y="602" width="300" height="90" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="44" y="623" fill="#e6edf3" font-size="11.5">CLI — verify · lint · generate · scenario · mutate</text>
  <text x="44" y="644" fill="#e6edf3" font-size="11.5">API — /api/live · /api/onboard · /api/verify</text>
  <text x="44" y="665" fill="#e6edf3" font-size="11.5">Web — net, ribbon, why, certificate</text>
  <text x="44" y="683" fill="#6e7681" font-size="10.5">browser fetches GitHub; the verifier never calls out</text>

  <!-- ============ GUARANTEE ============ -->
  <rect x="852" y="470" width="300" height="172" rx="8" fill="#090c10" stroke="#21262d"/>
  <text x="868" y="492" fill="#6e7681" font-size="11" font-weight="600" letter-spacing="0.14em">GUARANTEE</text>
  <text x="868" y="516" fill="#3fb950" font-size="11.5">✓ every rejection is a proof</text>
  <text x="868" y="534" fill="#8b949e" font-size="11">no false positives w.r.t. the spec</text>
  <text x="868" y="558" fill="#d29922" font-size="11.5">! soundness is relative to the spec</text>
  <text x="868" y="576" fill="#8b949e" font-size="11">a loose spec accepts more — and the</text>
  <text x="868" y="592" fill="#8b949e" font-size="11">permissiveness meter measures it</text>
  <text x="868" y="616" fill="#6e7681" font-size="11">1552 distinct legal shapes at depth 10</text>
  <text x="868" y="632" fill="#6e7681" font-size="11">infinite language ⇒ not a whitelist</text>

  <text x="28" y="710" fill="#6e7681" font-size="11">No ML anywhere · deterministic · runs offline · 18 tests</text>
  <text x="1152" y="710" fill="#8b949e" font-size="11.5" text-anchor="end" font-style="italic">Rare is not the same as impossible. Everyone else checks rare.</text>
</svg>
