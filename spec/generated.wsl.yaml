spec_version: 1
workflow: release

principals:
  gha_runner:
    class: service_account
    id_pattern: "*"        # TODO restrict to your bot identity

places:
  - id: start
    tokens:
      - { type: repository, value: "*" }
  - id: p_build
    carries: [digest]
  - id: p_publish
    carries: [digest]
  - id: p_test
    carries: [digest]

final: [p_publish]

transitions:
  - id: build
    principal: gha_runner
    consumes: [start]
    produces: [p_build]
    emits:
      - effect: registry_write
        scope: "registry://prod/*"   # TODO tighten scope
        digest: $digest
        requires_relation:
          - type: derives_from
            target: artifact_create   # TODO name the producing build
            bind: { digest: $digest }

  - id: publish
    principal: gha_runner
    consumes: [p_test]
    produces: [p_publish]
    emits:
      - effect: registry_write
        scope: "registry://prod/*"   # TODO tighten scope
        digest: $digest
        requires_relation:
          - type: derives_from
            target: artifact_create   # TODO name the producing build
            bind: { digest: $digest }

  - id: test
    principal: gha_runner
    consumes: [p_build]
    produces: [p_test]
    emits:
      - effect: registry_write
        scope: "registry://prod/*"   # TODO tighten scope
        digest: $digest
        requires_relation:
          - type: derives_from
            target: artifact_create   # TODO name the producing build
            bind: { digest: $digest }

relations:
