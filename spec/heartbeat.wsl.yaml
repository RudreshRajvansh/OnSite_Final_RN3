spec_version: 1
workflow: heartbeat

principals:
  gha_runner:
    class: service_account
    id_pattern: "*"        # TODO restrict to your bot identity

places:
  - id: start
    tokens:
      - { type: repository, value: "*" }
  - id: p_checkout
  - id: p_commit
  - id: p_stamp

final: [p_commit]

transitions:
  - id: checkout
    principal: gha_runner
    consumes: [start]
    produces: [p_checkout]
    emits:
      - effect: vcs_read
        scope: "repo/*"

  - id: commit
    principal: gha_runner
    consumes: [p_stamp]
    produces: [p_commit]
    emits:
      - effect: vcs_read
        scope: "repo/*"

  - id: stamp
    principal: gha_runner
    consumes: [p_checkout]
    produces: [p_stamp]
    emits:
      - effect: vcs_read
        scope: "repo/*"

