<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaskedRunner</title>
<style>
  :root {
    --bg: #0b0e14;
    --panel: #12161f;
    --panel2: #171c28;
    --line: #232a3a;
    --text: #dfe5f2;
    --muted: #8592ad;
    --accept: #3fb950;
    --reject: #f85149;
    --focus: #58a6ff;
    --warn: #d29922;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 var(--mono);
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 18px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 0.06em; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .spacer { flex: 1; }
  main {
    display: grid;
    grid-template-columns: 230px minmax(0, 1fr) 400px;
    height: calc(100vh - 51px);
  }
  aside, section { overflow: auto; }
  aside {
    border-right: 1px solid var(--line);
    background: var(--panel);
    padding: 14px;
  }
  .rail-title {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin: 0 0 8px;
  }
  .run {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    cursor: pointer;
    font: inherit;
  }
  .run:hover { border-color: var(--focus); }
  .run[aria-current="true"] { border-color: var(--focus); background: #1b2436; }
  .run .id { display: block; }
  .run .meta { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  .control { margin: 18px 0 0; }
  .control label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  input[type="range"] { width: 100%; }
  button.action {
    width: 100%;
    background: var(--panel2);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 8px;
    cursor: pointer;
    font: inherit;
    margin-top: 8px;
  }
  button.action:hover { border-color: var(--focus); }
  button.action:disabled { opacity: 0.45; cursor: default; }
  section { padding: 16px 20px; }
  .verdict {
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid var(--line);
    border-left-width: 4px;
    border-radius: 6px;
    padding: 12px 16px;
    background: var(--panel);
    margin-bottom: 16px;
  }
  .verdict.accept { border-left-color: var(--accept); }
  .verdict.reject { border-left-color: var(--reject); }
  .verdict .word { font-size: 19px; letter-spacing: 0.08em; }
  .verdict.accept .word { color: var(--accept); }
  .verdict.reject .word { color: var(--reject); }
  .verdict .detail { color: var(--muted); font-size: 12px; }
  .panel {
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    margin-bottom: 16px;
  }
  .panel > h2 {
    margin: 0;
    padding: 9px 14px;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    font-weight: 500;
  }
  .panel > .body { padding: 12px 14px; }
  svg { display: block; width: 100%; }
  .place { fill: var(--panel2); stroke: var(--line); }
  .place.marked { stroke: var(--focus); }
  .place.final { stroke-dasharray: 3 3; }
  .transition { fill: var(--panel2); stroke: var(--line); rx: 5; }
  .transition.fired { fill: #17301f; stroke: var(--accept); }
  .transition.active { fill: #1d3350; stroke: var(--focus); }
  .transition.unobserved { stroke-dasharray: 4 3; }
  .arc { stroke: #2c3546; fill: none; }
  .arc.hot { stroke: var(--focus); }
  .label { fill: var(--text); font-size: 11px; }
  .label.sub { fill: var(--muted); font-size: 9.5px; }
  .token { fill: var(--focus); }
  .effect { fill: var(--panel2); stroke: var(--line); rx: 5; }
  .effect.mus { stroke: var(--reject); fill: #2a1417; }
  .effect.matched { stroke: #2f4a35; }
  .rel { stroke: #3b4a63; fill: none; }
  .rel.missing { stroke: var(--reject); stroke-dasharray: 5 4; }
  .rel-label { fill: var(--muted); font-size: 9.5px; }
  .rel-label.missing { fill: var(--reject); }
  ol.steps { margin: 0; padding-left: 20px; }
  ol.steps li { margin-bottom: 4px; }
  ol.steps li.unobserved { color: var(--warn); }
  ul.facts { margin: 0; padding-left: 18px; }
  ul.facts li { margin-bottom: 4px; color: var(--reject); }
  p.note { color: var(--warn); margin: 0 0 8px; }
  p.fail { color: var(--muted); margin: 0 0 8px; }
  pre {
    margin: 0;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--muted);
    font-size: 11px;
    max-height: 260px;
    overflow: auto;
  }
  table.perm { width: 100%; border-collapse: collapse; }
  table.perm td { padding: 2px 0; }
  table.perm td.d { color: var(--muted); width: 42px; }
  table.perm td.n { text-align: right; width: 66px; }
  .bar { display: block; height: 8px; background: var(--focus); border-radius: 2px; opacity: 0.7; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 2px 10px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; word-break: break-all; }
</style>
</head>
<body>
<header>
  <h1>MASKEDRUNNER</h1>
  <span class="sub" id="spec-line">loading specification…</span>
  <span class="spacer"></span>
  <span class="sub" id="lint-line"></span>
</header>
<main>
  <aside>
    <p class="rail-title">Observed runs</p>
    <div id="runs"></div>
    <div class="control">
      <label for="slack">Unobserved steps permitted: <span id="slack-value">0</span></label>
      <input type="range" id="slack" min="0" max="6" value="0" step="1">
    </div>
    <button class="action" id="play">Play witness</button>
    <button class="action" id="perm">Measure permissiveness</button>
  </aside>

  <section>
    <div class="verdict" id="verdict">
      <span class="word">—</span>
      <span class="detail"></span>
    </div>
    <div class="panel">
      <h2>Workflow net · <span id="net-caption">declared execution model</span></h2>
      <div class="body"><svg id="net" role="img" aria-label="workflow net"></svg></div>
    </div>
    <div class="panel" id="perm-panel" hidden>
      <h2>Permissiveness · distinct effect-graph shapes by depth</h2>
      <div class="body"><table class="perm"><tbody id="perm-rows"></tbody></table></div>
    </div>
  </section>

  <section>
    <div class="panel">
      <h2>Observed effect graph</h2>
      <div class="body"><svg id="effects" role="img" aria-label="observed effect graph"></svg></div>
    </div>
    <div class="panel" id="explain-panel">
      <h2 id="explain-title">Explanation</h2>
      <div class="body" id="explain"></div>
    </div>
    <div class="panel">
      <h2>Certificate</h2>
      <div class="body">
        <dl class="kv" id="cert-kv"></dl>
        <button class="action" id="download">Fetch signed certificate</button>
        <pre id="cert-json"></pre>
      </div>
    </div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
